<!DOCTYPE html>

<html lang="uz"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Yangi operatsiya qo'shish - Telegram Mini App</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F5F3FF',
              100: '#EDE9FE',
              200: '#DDD6FE',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars">
    /* Hide scrollbar for horizontal chips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style data-purpose="interactive-animations">
    /* Subtle touch active feedback */
    .active-scale:active {
      transform: scale(0.97);
    }
    .sheet-enter {
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-neutral-900 font-sans antialiased text-neutral-800 flex justify-center items-end min-h-screen p-0 m-0 select-none overflow-hidden">
<!-- BEGIN: BackgroundOverlayScreen -->
<!-- Represents Customer page underneath the bottom sheet modal inside Telegram Mini App -->
<aside aria-hidden="true" class="fixed inset-0 bg-neutral-950/60 backdrop-blur-sm z-10 flex flex-col justify-start p-4">
<!-- Mock Telegram Bar -->
<div class="flex items-center justify-between text-neutral-400 text-xs font-medium py-2">
<div class="flex items-center gap-1.5">
<span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
<span class="text-neutral-200">Nasiya Bot</span>
</div>
<div class="flex items-center gap-2">
<span class="px-2 py-0.5 rounded-full bg-neutral-800/80 text-[10px] text-neutral-300">Telegram App</span>
</div>
</div>
<!-- Background Customer Profile Card (Faded) -->
<div class="mt-4 p-4 rounded-2xl bg-neutral-800/50 border border-neutral-700/40 text-neutral-300">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-lg text-white">AA</div>
<div>
<h2 class="font-semibold text-base text-white">Ahmad aka (stomatolog)</h2>
<p class="text-xs text-neutral-400">+998 90 123 45 67</p>
</div>
</div>
</div>
</aside>
<!-- END: BackgroundOverlayScreen -->
<!-- BEGIN: BottomSheetModal -->
<main class="sheet-enter relative z-20 w-full max-w-md bg-white rounded-t-[32px] shadow-2xl flex flex-col max-h-[92vh] overflow-y-auto no-scrollbar">
<!-- BEGIN: SheetHeaderArea -->
<!-- Handle bar & Header dismiss -->
<div class="pt-3 px-5 pb-2 sticky top-0 bg-white/95 backdrop-blur-md z-30 flex flex-col items-center">
<!-- Sheet grabber handle -->
<div class="w-11 h-1.5 bg-neutral-300 rounded-full mb-3" data-purpose="sheet-grabber"></div>
<div class="w-full flex items-center justify-between">
<div class="flex items-center gap-2">
<!-- Customer Badge Confirmation -->
<div class="flex items-center gap-2 px-2.5 py-1 bg-brand-50 rounded-full border border-brand-100" data-purpose="customer-indicator">
<span class="w-5 h-5 rounded-full bg-brand-600 text-white text-[10px] font-bold flex items-center justify-center">A</span>
<span class="text-xs font-medium text-brand-700 tracking-tight">Ahmad aka (stomatolog)</span>
</div>
</div>
<!-- Close Button -->
<button aria-label="Yopish" class="w-8 h-8 rounded-full bg-neutral-100 hover:bg-neutral-200 text-neutral-500 hover:text-neutral-700 flex items-center justify-center transition active-scale" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</div>
<!-- END: SheetHeaderArea -->
<!-- Modal Content Body -->
<div class="px-5 pt-1 pb-6 space-y-5">
<!-- BEGIN: SegmentedControl -->
<!-- Toggle between Debt (Nasiya) and Repayment -->
<nav aria-label="Operatsiya turi" class="p-1 bg-neutral-100 rounded-2xl flex items-center gap-1 border border-neutral-200/60" data-purpose="operation-type-toggle">
<button class="flex-1 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 bg-brand-600 text-white shadow-md shadow-brand-600/30 flex items-center justify-center gap-1.5 active-scale" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          Qarz yozish (Nasiya)
        </button>
<button class="flex-1 py-2.5 rounded-xl font-medium text-sm text-neutral-600 hover:text-neutral-900 transition-all duration-200 flex items-center justify-center gap-1.5 active-scale" type="button">
<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          To'lov qabul qilish
        </button>
</nav>
<!-- END: SegmentedControl -->
<!-- BEGIN: AmountEntrySection -->
<!-- Fintech styled prominent amount display -->
<section aria-labelledby="amount-label" class="bg-gradient-to-b from-brand-50/50 to-neutral-50 p-4 rounded-2xl border border-brand-100/60 flex flex-col items-center">
<span class="text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1" id="amount-label">Summani kiriting</span>
<!-- Large bold amount typography -->
<div class="flex items-baseline justify-center gap-1.5 my-1">
<span class="text-4xl font-extrabold tracking-tight text-neutral-900">550 000</span>
<span class="text-lg font-bold text-brand-600">UZS</span>
</div>
<!-- Quick Increment Chips -->
<div class="w-full flex items-center gap-1.5 mt-3 overflow-x-auto no-scrollbar pt-1" data-purpose="quick-increments">
<button class="px-3 py-1.5 text-xs font-medium bg-white hover:bg-neutral-100 border border-neutral-200 text-neutral-700 rounded-lg whitespace-nowrap active-scale shadow-sm" type="button">
            +50 000
          </button>
<button class="px-3 py-1.5 text-xs font-medium bg-white hover:bg-neutral-100 border border-neutral-200 text-neutral-700 rounded-lg whitespace-nowrap active-scale shadow-sm" type="button">
            +100 000
          </button>
<button class="px-3 py-1.5 text-xs font-semibold bg-brand-100 border border-brand-200 text-brand-700 rounded-lg whitespace-nowrap active-scale shadow-sm" type="button">
            +500 000
          </button>
<button class="px-3 py-1.5 text-xs font-medium bg-white hover:bg-neutral-100 border border-neutral-200 text-neutral-600 rounded-lg whitespace-nowrap active-scale shadow-sm" type="button">
            To'liq summa
          </button>
</div>
</section>
<!-- END: AmountEntrySection -->
<!-- BEGIN: DueDateSection -->
<!-- Payment due date selector with preset tags -->
<section aria-labelledby="due-date-label" class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-xs font-semibold text-neutral-600 uppercase tracking-wider" id="due-date-label">To'lov muddati</label>
<span class="text-xs text-brand-600 font-medium">17-may, 2025</span>
</div>
<!-- Date Pill Buttons -->
<div class="flex flex-wrap gap-2" data-purpose="date-pill-selector">
<button class="px-3.5 py-2 text-xs font-medium rounded-xl border border-neutral-200 text-neutral-700 bg-neutral-50 hover:bg-neutral-100 active-scale" type="button">
            3 kun
          </button>
<!-- Selected Date Pill -->
<button class="px-3.5 py-2 text-xs font-semibold rounded-xl border-2 border-brand-600 bg-brand-50 text-brand-700 ring-2 ring-brand-100 active-scale flex items-center gap-1 shadow-sm" type="button">
<span>1 hafta</span>
<svg class="w-3.5 h-3.5 text-brand-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</button>
<button class="px-3.5 py-2 text-xs font-medium rounded-xl border border-neutral-200 text-neutral-700 bg-neutral-50 hover:bg-neutral-100 active-scale" type="button">
            1 oy
          </button>
<button class="px-3.5 py-2 text-xs font-medium rounded-xl border border-neutral-200 text-neutral-700 bg-neutral-50 hover:bg-neutral-100 active-scale" type="button">
            Oy oxirigacha
          </button>
<button class="px-3.5 py-2 text-xs font-medium rounded-xl border border-dashed border-neutral-300 text-neutral-600 bg-white hover:bg-neutral-50 active-scale flex items-center gap-1" type="button">
<span>📅 Boshqa sana</span>
</button>
</div>
</section>
<!-- END: DueDateSection -->
<!-- BEGIN: CommentAndVoiceSection -->
<!-- Details / notes with integrated audio voice input -->
<section aria-label="Izoh va audio qayd" class="space-y-1.5">
<label class="text-xs font-semibold text-neutral-600 uppercase tracking-wider block" for="operation-note">Izoh yoki mahsulot nomi</label>
<div class="relative flex items-center">
<input class="w-full text-sm bg-neutral-50 border border-neutral-200 rounded-xl pl-3.5 pr-28 py-3 text-neutral-800 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition" id="operation-note" placeholder="Izoh (masalan: un, yog', shakar)..." type="text" value="2 qop oliy un, 5l yog'"/>
<!-- Voice Note Button Trigger -->
<button aria-label="Ovozli yozish" class="absolute right-1.5 top-1.5 bottom-1.5 px-2.5 flex items-center gap-1 text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200/70 rounded-lg active-scale transition shadow-sm" type="button">
<span class="text-sm">🎙</span>
<span class="text-[11px] leading-tight">Ovozli yozish</span>
</button>
</div>
</section>
<!-- END: CommentAndVoiceSection -->
<!-- BEGIN: ActionButtons -->
<!-- Primary submission and cancellation links -->
<footer class="pt-2 pb-1 space-y-2.5">
<!-- Main Primary Submission Button -->
<button class="w-full py-4 px-4 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-2xl font-bold text-base shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 active-scale transition duration-150" type="button">
<span>Tasdiqlash va saqlash</span>
<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-white/20 text-white">(550 000 UZS qarz)</span>
</button>
<!-- Cancel Text Button -->
<button class="w-full py-2 text-sm font-medium text-neutral-400 hover:text-neutral-600 text-center transition" type="button">
          Bekor qilish
        </button>
</footer>
<!-- END: ActionButtons -->
</div>
</main>
<!-- END: BottomSheetModal -->
</body></html>
